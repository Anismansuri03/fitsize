name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Check output stays inside Cloudflare's free-plan limits
        run: |
          BIG=$(find dist -type f -size +25M)
          if [ -n "$BIG" ]; then
            echo "::error::These files are over Cloudflare Pages' 25 MiB per-file limit:"
            echo "$BIG"
            exit 1
          fi
          COUNT=$(find dist -type f | wc -l)
          echo "$COUNT files in dist/ (Cloudflare Pages free plan allows up to 20,000)"
